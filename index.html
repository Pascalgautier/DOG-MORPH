<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DOG MORPH — Broadcast Quadruped</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --green: #00ff41;
      --dark: #000000;
      --text: #cccccc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    body { background: var(--dark); color: var(--text); font-family: 'Rajdhani', sans-serif; overflow-x: hidden; }

    /* Hero Section */
    .hero { position: relative; min-height: 80vh; display: flex; align-items: center; padding: 40px 60px; overflow: hidden; }
    .hero-bg { position: absolute; inset: 0; background: linear-gradient(to right, #000 30%, transparent), url('DOG_MORPH_HD.jpg') center/cover no-repeat; z-index: 1; opacity: 0.6; }
    .hero-content { position: relative; z-index: 10; max-width: 800px; }
    .hero-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(50px, 10vw, 120px); line-height: 0.9; color: white; }
    .hero-title span { color: var(--green); }

    /* Specs bar */
    .specs-bar { display: flex; overflow-x: auto; padding: 20px; background: #050505; border-bottom: 1px solid #111; gap: 30px; scrollbar-width: none; }
    .specs-bar::-webkit-scrollbar { display: none; }
    .spec-item { display: flex; align-items: center; gap: 10px; white-space: nowrap; font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #555; }
    .spec-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; }

    /* Viewer Section */
    .viewer-section { padding: 40px 60px; max-width: 1400px; margin: 0 auto; }
    .rc-row { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px; }
    .rc-box { flex: 1; min-width: 320px; border: 1px solid #1a1a1a; background: #020202; overflow: hidden; position: relative; }
    
    #rc { width: 100%; height: 500px; display: block; touch-action: none; background: #000; }
    iframe { width: 100%; height: 500px; border: none; }
    .rc-caption { padding: 10px; font-family: 'Share Tech Mono', monospace; font-size: 10px; color: #444; background: #050505; text-transform: uppercase; }

    @media (max-width: 768px) {
        .hero { padding: 20px; min-height: 50vh; }
        .viewer-section { padding: 20px; }
        #rc, iframe { height: 350px; }
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <div style="font-family:'Share Tech Mono'; color:var(--green); font-size:11px; margin-bottom:15px;">// PASCAL ROBOTICS — 2026</div>
      <h1 class="hero-title">DOG<span>MORPH</span></h1>
      <p style="margin-top:20px; max-width:400px; font-weight:600;">Broadcast Quadruped Platform. Silent Inmotion Drive. AxisCtrl Integrated.</p>
    </div>
  </section>

  <div class="specs-bar">
    <div class="spec-item"><div class="spec-dot"></div>UNITREE B2-W</div>
    <div class="spec-item"><div class="spec-dot"></div>HUB MOTORS V12</div>
    <div class="spec-item"><div class="spec-dot"></div>VESC 6 FOC SILENT</div>
    <div class="spec-item"><div class="spec-dot"></div>EF REPRESENTATIVE</div>
  </div>

  <section class="viewer-section">
    <div class="rc-row">
      <div class="rc-box">
        <canvas id="rc"></canvas>
        <div class="rc-caption">// AxisCtrl Mobile — Real-time Monitoring</div>
      </div>
      <div class="rc-box">
        <iframe src="https://robosynx.com/visualize/560d7a42-3403-488b-a4c4-30f4ecaaa6b8?policy=custom&embed=1"></iframe>
        <div class="rc-caption">// Digital Twin — 3D Visualizer</div>
      </div>
    </div>
  </section>

  <script>
    (function() {
      const canvas = document.getElementById('rc');
      const ctx = canvas.getContext('2d');
      let W, H, dpr, t = 0;
      const mouse = { x: 0.5, y: 0.5, active: false };

      function resize() {
        const rect = canvas.getBoundingClientRect();
        dpr = window.devicePixelRatio || 1;
        W = rect.width;
        H = rect.height;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.scale(dpr, dpr);
      }

      // --- TES FONCTIONS DE DESSIN ORIGINALES (RÉPARÉES) ---
      function roundedRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function meter(x, y, w, h, fill, label) {
        ctx.fillStyle = 'rgba(0,255,65,0.1)';
        roundedRect(x, y, w, h, 3); ctx.fill();
        ctx.fillStyle = '#00ff41';
        roundedRect(x, y, w * fill, h, 3); ctx.fill();
        ctx.font = '9px "Share Tech Mono"';
        ctx.fillText(label, x, y - 5);
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);

        // Fond & Grille
        ctx.strokeStyle = 'rgba(0,255,65,0.05)';
        for(let i=0; i<W; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }

        // Joystick
        const cx = W/2, cy = H/2, r = Math.min(W, H) * 0.25;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(0,255,65,0.2)'; ctx.stroke();
        
        let jx = cx, jy = cy;
        if(mouse.active) {
            jx = cx + (mouse.x - 0.5) * r * 1.8;
            jy = cy + (mouse.y - 0.5) * r * 1.8;
        } else {
            jx = cx + Math.sin(t*0.02) * 20;
            jy = cy + Math.cos(t*0.02) * 20;
        }

        ctx.fillStyle = '#00ff41';
        ctx.beginPath(); ctx.arc(jx, jy, 15, 0, Math.PI*2); ctx.fill();

        // Meters
        meter(20, H - 60, 120, 8, 0.8 + Math.sin(t*0.01)*0.1, "BATTERY");
        meter(20, H - 30, 120, 8, 0.4 + Math.cos(t*0.02)*0.2, "SIGNAL");

        // Status
        ctx.fillStyle = '#00ff41';
        ctx.font = '11px "Share Tech Mono"';
        ctx.fillText("// SYSTEM OK", 20, 30);
        ctx.globalAlpha = Math.sin(t*0.1) > 0 ? 1 : 0.3;
        ctx.fillText("● LIVE DATA", W - 100, 30);
        ctx.globalAlpha = 1;

        t += 1;
        requestAnimationFrame(draw);
      }

      // --- GESTION TACTILE MOBILE CRITIQUE ---
      function handleMove(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        if(clientX && clientY) {
            mouse.x = (clientX - rect.left) / W;
            mouse.y = (clientY - rect.top) / H;
        }
      }

      canvas.addEventListener('pointerdown', (e) => { mouse.active = true; handleMove(e); });
      window.addEventListener('pointerup', () => { mouse.active = false; });
      canvas.addEventListener('pointermove', handleMove);
      
      // Prevent scrolling while touching joystick
      canvas.addEventListener('touchstart', (e) => { mouse.active = true; handleMove(e); }, {passive: false});
      canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, {passive: false});

      window.addEventListener('resize', resize);
      resize();
      draw();
    })();
  </script>
</body>
</html>

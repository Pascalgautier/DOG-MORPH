<script>
    window.addEventListener('load', function () {
      const canvas = document.getElementById('rc');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      let dpr = Math.max(1, window.devicePixelRatio || 1);
      let t = 0;
      let W = 0, H = 0;
      const mouse = { x: 0.5, y: 0.5, active: false };

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        W = Math.max(1, rect.width);
        H = Math.max(1, rect.height);
        dpr = Math.max(1, window.devicePixelRatio || 1);
        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function roundedRect(x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function line(x1, y1, x2, y2, color, alpha, width) {
        ctx.save();
        ctx.strokeStyle = color;
        ctx.globalAlpha = alpha == null ? 1 : alpha;
        ctx.lineWidth = width || 1;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.restore();
      }

      function text(txt, x, y, size, color, align, alpha) {
        ctx.save();
        ctx.globalAlpha = alpha == null ? 1 : alpha;
        ctx.fillStyle = color || '#00ff41';
        ctx.font = (size || 12) + 'px "Share Tech Mono", monospace';
        ctx.textAlign = align || 'left';
        ctx.fillText(txt, x, y);
        ctx.restore();
      }

      function drawGrid(w, h) {
        ctx.save();
        ctx.strokeStyle = 'rgba(0,255,65,0.07)';
        ctx.lineWidth = 1;
        for (let x = 0; x < w; x += 28) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, h);
          ctx.stroke();
        }
        for (let y = 0; y < h; y += 28) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(w, y);
          ctx.stroke();
        }
        ctx.restore();
      }

      function panel(x, y, pw, ph, title) {
        ctx.save();
        roundedRect(x, y, pw, ph, 10);
        ctx.fillStyle = 'rgba(0,255,65,0.025)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,255,65,0.22)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();

        text(title, x + 10, y + 16, 10, '#00ff41', 'left', 0.95);
        line(x + 10, y + 22, x + pw - 10, y + 22, '#00ff41', 0.15, 1);
      }

      function joystick(cx, cy, r, dx, dy, label) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(0,255,65,0.3)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();

        line(cx - r, cy, cx + r, cy, '#00ff41', 0.15, 1);
        line(cx, cy - r, cx, cy + r, '#00ff41', 0.15, 1);

        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.55, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(0,255,65,0.15)';
        ctx.stroke();
        ctx.restore();

        const px = cx + dx;
        const py = cy + dy;

        ctx.save();
        const g = ctx.createRadialGradient(px, py, 0, px, py, 20);
        g.addColorStop(0, 'rgba(0,255,65,0.7)');
        g.addColorStop(1, 'rgba(0,255,65,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(px, py, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.arc(px, py, 7, 0, Math.PI * 2);
        ctx.fillStyle = '#00ff41';
        ctx.fill();
        ctx.restore();

        text(label, cx, cy + r + 16, 9, '#888', 'center', 0.9);
      }

      function meter(x, y, w, h, fill, label) {
        ctx.save();
        roundedRect(x, y, w, h, 3);
        ctx.fillStyle = 'rgba(0,255,65,0.06)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,255,65,0.22)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();

        const ff = Math.max(0, Math.min(1, fill));
        if (ff > 0) {
          ctx.save();
          roundedRect(x + 1, y + 1, Math.max(1, (w - 2) * ff), h - 2, 2);
          const g = ctx.createLinearGradient(x, y, x + w, y);
          g.addColorStop(0, 'rgba(0,255,65,0.3)');
          g.addColorStop(1, 'rgba(0,255,65,0.9)');
          ctx.fillStyle = g;
          ctx.fill();
          ctx.restore();
        }

        text(label, x, y - 4, 9, '#888', 'left', 0.85);
        text(Math.round(ff * 100) + '%', x + w, y - 4, 9, '#00ff41', 'right', 0.9);
      }

      function drawPreview(x, y, w, h) {
        ctx.save();
        roundedRect(x, y, w, h, 6);
        ctx.clip();

        const g = ctx.createLinearGradient(x, y, x, y + h);
        g.addColorStop(0, '#0a1410');
        g.addColorStop(0.6, '#050806');
        g.addColorStop(1, '#000');
        ctx.fillStyle = g;
        ctx.fillRect(x, y, w, h);

        const horizon = y + h * 0.55 + Math.sin(t * 0.001) * 3;
        line(x, horizon, x + w, horizon, '#00ff41', 0.2, 1);

        const sx = x + w * 0.5 + Math.sin(t * 0.0008) * w * 0.25;
        const sy = horizon - 14;
        ctx.fillStyle = 'rgba(0,255,65,0.4)';
        ctx.fillRect(sx - 4, sy - 14, 8, 18);
        ctx.fillRect(sx - 8, sy + 4, 4, 8);
        ctx.fillRect(sx + 4, sy + 4, 4, 8);

        const cx = x + w / 2;
        const cy = y + h / 2;
        line(cx - 10, cy, cx + 10, cy, '#00ff41', 0.7, 1);
        line(cx, cy - 10, cx, cy + 10, '#00ff41', 0.7, 1);
        ctx.save();
        ctx.strokeStyle = '#00ff41';
        ctx.globalAlpha = 0.45;
        ctx.strokeRect(cx - 18, cy - 12, 36, 24);
        ctx.restore();

        ctx.restore();

        ctx.save();
        roundedRect(x, y, w, h, 6);
        ctx.strokeStyle = 'rgba(0,255,65,0.3)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();

        text('CAM 01 — LIVE', x + 8, y + 14, 9, '#00ff41', 'left', 0.95);
        text('REC ●', x + w - 8, y + 14, 9, '#ff3344', 'right', 0.7 + Math.sin(t * 0.01) * 0.3);
      }

      function drawRadar(cx, cy, r) {
        for (let i = 1; i <= 3; i++) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, (r / 3) * i, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(0,255,65,0.18)';
          ctx.stroke();
          ctx.restore();
        }
        line(cx - r, cy, cx + r, cy, '#00ff41', 0.18, 1);
        line(cx, cy - r, cx, cy + r, '#00ff41', 0.18, 1);

        const sweep = (t * 0.002) % (Math.PI * 2);
        ctx.save();
        if (typeof ctx.createConicGradient === 'function') {
          const sg = ctx.createConicGradient(sweep, cx, cy);
          sg.addColorStop(0, 'rgba(0,255,65,0.5)');
          sg.addColorStop(0.15, 'rgba(0,255,65,0)');
          sg.addColorStop(1, 'rgba(0,255,65,0)');
          ctx.fillStyle = sg;
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.strokeStyle = 'rgba(0,255,65,0.7)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx + Math.cos(sweep) * r, cy + Math.sin(sweep) * r);
          ctx.stroke();
        }
        ctx.restore();

        const blips = [
          { a: 0.6, d: 0.55 },
          { a: 2.2, d: 0.8 },
          { a: 4.1, d: 0.35 }
        ];
        for (const b of blips) {
          const bx = cx + Math.cos(b.a) * r * b.d;
          const by = cy + Math.sin(b.a) * r * b.d;
          const pulse = (Math.sin(t * 0.004 + b.a) + 1) * 0.5;
          ctx.save();
          ctx.fillStyle = 'rgba(0,255,65,' + (0.4 + pulse * 0.5) + ')';
          ctx.beginPath();
          ctx.arc(bx, by, 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function drawRemote() {
        // Re-check size each frame (cheap) in case of layout changes
        const rect = canvas.getBoundingClientRect();
        if (Math.abs(rect.width - W) > 1 || Math.abs(rect.height - H) > 1) {
          resizeCanvas();
        }

        const w = W;
        const h = H;

        if (w < 20 || h < 20) {
          requestAnimationFrame(drawRemote);
          return;
        }

        ctx.clearRect(0, 0, w, h);
        const bg = ctx.createLinearGradient(0, 0, 0, h);
        bg.addColorStop(0, '#0a0a0a');
        bg.addColorStop(1, '#020202');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);

        drawGrid(w, h);

        // Scanlines
        ctx.save();
        ctx.globalAlpha = 0.05;
        ctx.fillStyle = '#00ff41';
        for (let i = 0; i < h; i += 4) {
          ctx.fillRect(0, i, w, 1);
        }
        ctx.restore();

        // Header
        text('// AXISCTRL REMOTE', 14, 20, 11, '#00ff41', 'left', 0.95);
        text('DOG MORPH LIVE', w - 14, 20, 11, '#00ff41', 'right', 0.9);
        line(14, 30, w - 14, 30, '#00ff41', 0.25, 1);

        // Decide layout: 3 cols if wide enough, else vertical stack
        const isNarrow = w < 560;

        const pad = 10;
        const topY = 44;
        const bottomPad = 24;

        if (!isNarrow) {
          // ---- 3 columns horizontal layout ----
          const panelH = h - topY - bottomPad;
          const leftW = Math.max(160, Math.min(240, w * 0.3));
          const rightW = Math.max(140, Math.min(200, w * 0.25));
          const centerW = w - leftW - rightW - pad * 4;

          const leftX = pad;
          const centerX = leftX + leftW + pad;
          const rightX = centerX + centerW + pad;

          // LEFT
          panel(leftX, topY, leftW, panelH, 'MOTION / DRIVE');
          const joyCX = leftX + leftW / 2;
          const joyCY = topY + 30 + (panelH - 30) * 0.35;
          const joyR = Math.min(leftW * 0.35, panelH * 0.22);

          let dx, dy;
          if (mouse.active) {
            dx = (mouse.x - 0.5) * 2 * joyR * 0.7;
            dy = (mouse.y - 0.5) * 2 * joyR * 0.7;
          } else {
            dx = Math.sin(t * 0.0012) * joyR * 0.45;
            dy = Math.cos(t * 0.0015) * joyR * 0.45;
          }
          joystick(joyCX, joyCY, joyR, dx, dy, 'VX / VY');

          // Modes
          const modes = ['STUDIO', 'CARVING', 'STAND'];
          const active = Math.floor((t * 0.0005) % 3);
          const modeY = joyCY + joyR + 34;
          const modeW = (leftW - 20 - 6 * (modes.length - 1)) / modes.length;
          for (let i = 0; i < modes.length; i++) {
            const mx = leftX + 10 + i * (modeW + 6);
            const on = i === active;
            ctx.save();
            roundedRect(mx, modeY, modeW, 22, 4);
            ctx.fillStyle = on ? 'rgba(0,255,65,0.2)' : 'rgba(0,255,65,0.04)';
            ctx.fill();
            ctx.strokeStyle = on ? 'rgba(0,255,65,0.8)' : 'rgba(0,255,65,0.2)';
            ctx.stroke();
            ctx.restore();
            text(modes[i], mx + modeW / 2, modeY + 15, 9, on ? '#00ff41' : '#888', 'center');
          }

          // CENTER
          panel(centerX, topY, centerW, panelH, 'CAMERA / PREVIEW');
          const previewX = centerX + 10;
          const previewY = topY + 34;
          const previewW = centerW - 20;
          const previewH = Math.min(160, panelH * 0.48);
          drawPreview(previewX, previewY, previewW, previewH);

          const vals = [
            0.72 + Math.sin(t * 0.0011) * 0.08,
            0.55 + Math.cos(t * 0.0013) * 0.1,
            0.88 + Math.sin(t * 0.0017 + 1) * 0.05
          ];
          let mY = previewY + previewH + 20;
          meter(previewX, mY, previewW, 10, vals[0], 'PAN / TILT LOAD');
          mY += 26;
          meter(previewX, mY, previewW, 10, vals[1], 'IRIS / ZOOM');
          mY += 26;
          meter(previewX, mY, previewW, 10, vals[2], 'LINK STABILITY');

          // RIGHT
          panel(rightX, topY, rightW, panelH, 'SPATIAL / STATUS');
          const radarR = Math.min(rightW * 0.35, panelH * 0.22);
          const radarCX = rightX + rightW / 2;
          const radarCY = topY + 34 + radarR + 4;
          drawRadar(radarCX, radarCY, radarR);

          const statusLines = [
            ['BATTERY', Math.round(82 + Math.sin(t * 0.0005) * 2) + '%'],
            ['LATENCY', Math.round(12 + Math.sin(t * 0.002) * 4) + ' MS'],
            ['NOISE', Math.round(42 + Math.sin(t * 0.0012) * 2) + ' DB(A)'],
            ['LINK', 'OK']
          ];
          let sy = radarCY + radarR + 22;
          for (const row of statusLines) {
            text(row[0], rightX + 12, sy, 9, '#888', 'left', 0.9);
            text(row[1], rightX + rightW - 12, sy, 10, '#00ff41', 'right');
            sy += 16;
          }
        } else {
          // ---- Vertical stack for narrow / mobile ----
          const colW = w - pad * 2;
          let curY = topY;

          // MOTION panel
          const motionH = 180;
          panel(pad, curY, colW, motionH, 'MOTION / DRIVE');
          const joyR = Math.min(colW * 0.18, 50);
          const joyCX = pad + colW * 0.28;
          const joyCY = curY + motionH / 2 + 4;
          let dx, dy;
          if (mouse.active) {
            dx = (mouse.x - 0.5) * 2 * joyR * 0.7;
            dy = (mouse.y - 0.5) * 2 * joyR * 0.7;
          } else {
            dx = Math.sin(t * 0.0012) * joyR * 0.45;
            dy = Math.cos(t * 0.0015) * joyR * 0.45;
          }
          joystick(joyCX, joyCY, joyR, dx, dy, 'VX / VY');

          // Modes on the right of joystick
          const modes = ['STUDIO', 'CARVING', 'STAND'];
          const active = Math.floor((t * 0.0005) % 3);
          const modeStartX = pad + colW * 0.5;
          const modeW2 = colW * 0.45;
          for (let i = 0; i < modes.length; i++) {
            const my = curY + 36 + i * 32;
            const on = i === active;
            ctx.save();
            roundedRect(modeStartX, my, modeW2, 24, 4);
            ctx.fillStyle = on ? 'rgba(0,255,65,0.2)' : 'rgba(0,255,65,0.04)';
            ctx.fill();
            ctx.strokeStyle = on ? 'rgba(0,255,65,0.8)' : 'rgba(0,255,65,0.2)';
            ctx.stroke();
            ctx.restore();
            text(modes[i], modeStartX + modeW2 / 2, my + 16, 10, on ? '#00ff41' : '#888', 'center');
          }
          curY += motionH + 10;

          // CAMERA panel
          const camH = 150;
          panel(pad, curY, colW, camH, 'CAMERA / PREVIEW');
          drawPreview(pad + 10, curY + 30, colW - 20, camH - 40);
          curY += camH + 10;

          // STATUS panel with meters (compact)
          const statusH = h - curY - bottomPad;
          if (statusH > 60) {
            panel(pad, curY, colW, statusH, 'STATUS / METERS');
            const vals = [
              0.72 + Math.sin(t * 0.0011) * 0.08,
              0.88 + Math.sin(t * 0.0017 + 1) * 0.05
            ];
            let mY = curY + 36;
            meter(pad + 10, mY, colW - 20, 9, vals[0], 'PAN / TILT');
            mY += 24;
            meter(pad + 10, mY, colW - 20, 9, vals[1], 'LINK');
            mY += 22;
            text('BATTERY ' + Math.round(82 + Math.sin(t * 0.0005) * 2) + '%  ·  LATENCY ' + Math.round(12 + Math.sin(t * 0.002) * 4) + 'MS  ·  NOISE ' + Math.round(42 + Math.sin(t * 0.0012) * 2) + 'DB',
              pad + 10, mY + 8, 9, '#00ff41', 'left', 0.9);
          }
        }

        // Footer
        text('SOLEAU 09.02.2026', 14, h - 8, 9, '#555', 'left', 0.9);
        const blink = 0.6 + Math.sin(t * 0.006) * 0.4;
        text('● LIVE', w - 14, h - 8, 10, '#00ff41', 'right', blink);

        t += 16;
        requestAnimationFrame(drawRemote);
      }

      function onPointerMove(e) {
        const rect = canvas.getBoundingClientRect();
        mouse.x = (e.clientX - rect.left) / rect.width;
        mouse.y = (e.clientY - rect.top) / rect.height;
        mouse.active = true;
      }

      function onPointerLeave() {
        mouse.active = false;
      }

      window.addEventListener('resize', resizeCanvas);
      canvas.addEventListener('pointermove', onPointerMove);
      canvas.addEventListener('pointerleave', onPointerLeave);

      resizeCanvas();
      requestAnimationFrame(drawRemote);
    });
  </script>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOG MORPH — Broadcast Quadruped Robot</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    /* ... Tes variables CSS restent identiques ... */
    :root {
      --green: #00ff41;
      --green-soft: rgba(0,255,65,0.14);
      --dark: #000000;
      --text: #cccccc;
    }

    /* Ajout d'une règle pour éviter le scroll horizontal sur mobile lors des animations */
    body { overflow-x: hidden; background: var(--dark); color: var(--text); font-family: 'Rajdhani', sans-serif; }

    /* Amélioration du bouton pour le rendre plus "tactile" */
    .btn-green {
      cursor: pointer;
      border: none;
      outline: none;
    }

    /* Fix pour l'iframe sur mobile */
    .rc-3d-frame { border: none; width: 100%; min-height: 400px; }

    /* --- Suite de ton CSS original --- */
    /* (Conserver tes styles .hero, .specs-bar, .features-grid, etc.) */
    /* ... */
    .hero-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.7)),
                  url('DOG_MORPH_HD.jpg') center/cover no-repeat;
      z-index: 1;
    }
    /* Copier ici le reste de tes styles originaux */
  </style>
</head>
<body>

  <section class="hero">
    <div class="hero-bg"></div>
    <div class="scan-line"></div>
    <div class="hero-top-tag">// Pascal Robotics — France // 2026</div>

    <div class="hero-content">
      <div class="hero-left">
        <h1 class="hero-title">DOG<span>MORPH</span></h1>
        <p class="hero-sub">
          The world's first silent broadcast camera platform built on a quadruped robot.
          Integrating <strong>Unitree B2-W</strong> technology with <strong>Electric Friends</strong> ecosystem.
        </p>
        </div>
    </div>
  </section>

  <script>
    (function () {
      function initRemoteCanvas() {
        const canvas = document.getElementById('rc');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        
        let dpr, W, H, t = 0;
        const mouse = { x: 0.5, y: 0.5, active: false };

        function resize() {
          const rect = canvas.getBoundingClientRect();
          dpr = window.devicePixelRatio || 1;
          W = rect.width;
          H = rect.height;
          // Correction du flou sur écrans HD
          canvas.width = W * dpr;
          canvas.height = H * dpr;
          ctx.scale(dpr, dpr);
        }

        // --- Tes fonctions de dessin (roundedRect, line, text, etc.) sont excellentes ---
        // Garde-les telles quelles, elles sont très bien optimisées.

        function drawRemote() {
          if (W === 0 || H === 0) {
            requestAnimationFrame(drawRemote);
            return;
          }

          ctx.clearRect(0, 0, W, H);
          
          // Fond dégradé
          const bg = ctx.createLinearGradient(0, 0, 0, H);
          bg.addColorStop(0, '#080808');
          bg.addColorStop(1, '#020202');
          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, W, H);

          // Logique Responsive améliorée dans le script
          const isMobile = W < 600;
          
          if (!isMobile) {
            // Version Desktop : 3 colonnes
            drawInterfaceDesktop(W, H, ctx, t, mouse);
          } else {
            // Version Mobile : Empilement vertical simplifié
            drawInterfaceMobile(W, H, ctx, t, mouse);
          }

          t += 1; // Incrément constant pour l'animation
          requestAnimationFrame(drawRemote);
        }

        // Découper ton code en sous-fonctions rend la maintenance plus facile
        function drawInterfaceDesktop(W, H, ctx, t, mouse) {
          // ... Insère ici ta logique de calcul des panels (MOTION, CAMERA, SPATIAL) ...
          // Utilise tes fonctions text(), joystick(), etc.
        }

        function drawInterfaceMobile(W, H, ctx, t, mouse) {
          // Simplification des coordonnées pour éviter que le texte ne bave
        }

        // Event Listeners avec support Touch pour mobile
        canvas.addEventListener('pointermove', (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse.x = (e.clientX - rect.left) / W;
          mouse.y = (e.clientY - rect.top) / H;
          mouse.active = true;
        });
        canvas.addEventListener('pointerleave', () => mouse.active = false);
        window.addEventListener('resize', resize);

        resize();
        drawRemote();
      }

      document.readyState === 'loading' 
        ? document.addEventListener('DOMContentLoaded', initRemoteCanvas) 
        : initRemoteCanvas();
    })();
  </script>
</body>
</html>

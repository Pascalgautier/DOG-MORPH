<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DOG MORPH — Broadcast Quadruped</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    :root {
      --green: #00ff41;
      --dark: #000000;
      --text: #cccccc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    body { background: var(--dark); color: var(--text); font-family: 'Rajdhani', sans-serif; overflow-x: hidden; }

    /* Hero Section */
    .hero { position: relative; min-height: 80vh; display: flex; align-items: center; padding: 40px 60px; overflow: hidden; }
    .hero-bg { position: absolute; inset: 0; background: linear-gradient(to right, #000 30%, transparent), url('DOG_MORPH_HD.jpg') center/cover no-repeat; z-index: 1; opacity: 0.6; }
    .hero-content { position: relative; z-index: 10; max-width: 800px; }
    .hero-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(50px, 10vw, 120px); line-height: 0.9; color: white; }
    .hero-title span { color: var(--green); }

    /* Specs bar */
    .specs-bar { display: flex; overflow-x: auto; padding: 20px; background: #050505; border-bottom: 1px solid #111; gap: 30px; scrollbar-width: none; }
    .specs-bar::-webkit-scrollbar { display: none; }
    .spec-item { display: flex; align-items: center; gap: 10px; white-space: nowrap; font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #555; }
    .spec-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; }

    /* Viewer Section */
    .viewer-section { padding: 40px 60px; max-width: 1400px; margin: 0 auto; }
    .rc-row { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px; }
    .rc-box { flex: 1; min-width: 320px; border: 1px solid #1a1a1a; background: #020202; overflow: hidden; position: relative; display: flex; flex-direction: column; }
    
    /* 2. STYLES POUR LE VIEWER 3D */
    model-viewer {
      width: 100%;
      height: 500px; /* Conserver la même hauteur que l'iframe */
      background-color: #000;
      --poster-color: transparent; /* Pour éviter un flash blanc au chargement */
    }

    iframe { width: 100%; height: 500px; border: none; }
    .rc-caption { padding: 10px; font-family: 'Share Tech Mono', monospace; font-size: 10px; color: #444; background: #050505; text-transform: uppercase; border-top: 1px solid #1a1a1a; }

    @media (max-width: 768px) {
        .hero { padding: 20px; min-height: 50vh; }
        .viewer-section { padding: 20px; }
        model-viewer, iframe { height: 350px; }
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <div style="font-family:'Share Tech Mono'; color:var(--green); font-size:11px; margin-bottom:15px;">// PASCAL ROBOTICS — 2026</div>
      <h1 class="hero-title">DOG<span>MORPH</span></h1>
      <p style="margin-top:20px; max-width:400px; font-weight:600;">Broadcast Quadruped Platform. Silent Inmotion Drive. AxisCtrl Integrated.</p>
    </div>
  </section>

  <div class="specs-bar">
    <div class="spec-item"><div class="spec-dot"></div>UNITREE B2-W</div>
    <div class="spec-item"><div class="spec-dot"></div>HUB MOTORS V12</div>
    <div class="spec-item"><div class="spec-dot"></div>VESC 6 FOC SILENT</div>
    <div class="spec-item"><div class="spec-dot"></div>EF REPRESENTATIVE</div>
  </div>

  <section class="viewer-section">
    <div class="rc-row">
      <div class="rc-box">
        <model-viewer 
          src="REMOTE.glb" 
          ar 
          ar-modes="webxr scene-viewer quick-look" 
          camera-controls 
          tone-mapping="neutral" 
          poster="poster.webp" 
          shadow-intensity="1" 
          auto-rotate>
          <div class="progress-bar" slot="progress-bar">
              <div class="update-bar"></div>
          </div>
        </model-viewer>
        <div class="rc-caption">// AxisCtrl Mobile Remote — Interactive 3D Model</div>
      </div>
      <div class="rc-box">
        <iframe src="https://robosynx.com/visualize/560d7a42-3403-488b-a4c4-30f4ecaaa6b8?policy=custom&embed=1"></iframe>
        <div class="rc-caption">// Digital Twin — Dog Morph 3D Visualizer</div>
      </div>
    </div>
  </section>

  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOG MORPH — Broadcast Quadruped Robot</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root { --green: #00ff41; --dark: #000000; --text: #cccccc; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--dark); color: var(--text); font-family: 'Rajdhani', sans-serif; overflow-x: hidden; }
    
    .hero { position: relative; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    
    .hero-bg { 
      position: absolute; 
      inset: 0; 
      background: linear-gradient(90deg, rgba(0,0,0,0.90) 0%, rgba(0,0,0,0.5) 55%, rgba(0,0,0,0.1) 100%), 
                  url('DOG_MORPH_HD.jpg') center/cover no-repeat; 
      z-index: 1; 
    }

    .scan-line { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,65,0.015) 2px, rgba(0,255,65,0.015) 4px); pointer-events: none; animation: scan 8s linear infinite; z-index: 2; }
    @keyframes scan { 0% { background-position: 0 0; } 100% { background-position: 0 100px; } }
    
    .hero-content { position: relative; z-index: 10; width: 100%; max-width: 1400px; padding: 0 60px; }
    .hero-left { display: flex; flex-direction: column; gap: 24px; max-width: 600px; }
    
    .tag { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--green); letter-spacing: 4px; text-transform: uppercase; opacity: 0; animation: fadeUp 0.6s ease forwards 0.2s; }
    .hero-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(80px, 10vw, 140px); line-height: 0.9; color: white; letter-spacing: -2px; opacity: 0; animation: fadeUp 0.8s ease forwards 0.4s; }
    .hero-title span { color: var(--green); display: block; }
    .hero-sub { font-size: 16px; font-weight: 300; color: #999; line-height: 1.6; max-width: 400px; opacity: 0; animation: fadeUp 0.8s ease forwards 0.6s; }
    
    .hero-stats { display: flex; gap: 32px; opacity: 0; animation: fadeUp 0.8s ease forwards 0.8s; }
    .stat { display: flex; flex-direction: column; gap: 4px; }
    .stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--green); line-height: 1; }
    .stat-label { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: #555; letter-spacing: 2px; text-transform: uppercase; }
    
    .hero-cta { display: flex; gap: 16px; opacity: 0; animation: fadeUp 0.8s ease forwards 1s; }
    
    .btn-primary, .btn-secondary { 
      padding: 14px 32px; font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px; text-decoration: none; display: inline-block; transition: all 0.2s; 
    }
    
    .btn-primary { 
      background: var(--green); color: #000; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px)); 
    }
    .btn-primary:hover { background: white; transform: translateY(-2px); }
    
    .btn-secondary { border: 1px solid #444; color: #fff; background: rgba(255,255,255,0.05); }
    .btn-secondary:hover { border-color: var(--green); color: var(--green); }
    
    .corner-tag { position: absolute; bottom: 40px; right: 60px; font-family: 'Share Tech Mono', monospace; font-size: 10px; color: #555; letter-spacing: 3px; z-index: 10; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    
    .glow-line { width: 100%; height: 1px; background: linear-gradient(90deg, transparent, var(--green), transparent); opacity: 0.3; }
    .specs-bar { border-top: 1px solid #111; border-bottom: 1px solid #111; padding: 20px 60px; display: flex; overflow: hidden; background: #030303; }
    .spec-item { display: flex; align-items: center; gap: 12px; padding: 0 32px; border-right: 1px solid #1a1a1a; white-space: nowrap; }
    .spec-item:first-child { padding-left: 0; }
    .spec-dot { width: 6px; height: 6px; background: var(--green); flex-shrink: 0; }
    .spec-text { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #555; letter-spacing: 1px; }
    
    .viewer-section { padding: 100px 60px; display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; max-width: 1400px; margin: 0 auto; }
    .section-label { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--green); letter-spacing: 4px; text-transform: uppercase; margin-bottom: 16px; }
    .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 64px; line-height: 0.95; color: white; margin-bottom: 24px; }
    .section-body { font-size: 15px; color: #666; line-height: 1.7; margin-bottom: 32px; }
    .viewer-frame { position: relative; border: 1px solid #1a1a1a; background: #050505; overflow: hidden; }
    .viewer-frame::before { content: ''; position: absolute; inset: 0; border: 1px solid rgba(0,255,65,0.1); pointer-events: none; z-index: 2; }
    .viewer-corner { position: absolute; width: 16px; height: 16px; z-index: 3; }
    .viewer-corner.tl { top: -1px; left: -1px; border-top: 2px solid var(--green); border-left: 2px solid var(--green); }
    .viewer-corner.tr { top: -1px; right: -1px; border-top: 2px solid var(--green); border-right: 2px solid var(--green); }
    .viewer-corner.bl { bottom: -1px; left: -1px; border-bottom: 2px solid var(--green); border-left: 2px solid var(--green); }
    .viewer-corner.br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--green); border-right: 2px solid var(--green); }
    .viewer-label { position: absolute; top: 12px; left: 16px; font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--green); letter-spacing: 2px; z-index: 3; }
    
    .features-section { padding: 100px 60px; border-top: 1px solid #111; max-width: 1400px; margin: 0 auto; }
    .features-header { margin-bottom: 60px; }
    .features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #111; }
    .feature-card { background: var(--dark); padding: 40px; transition: background 0.3s; }
    .feature-card:hover { background: #080808; }
    .feature-number { font-family: 'Bebas Neue', sans-serif; font-size: 48px; color: #1a1a1a; line-height: 1; margin-bottom: 16px; }
    .feature-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: white; letter-spacing: 1px; margin-bottom: 12px; }
    .feature-body { font-size: 14px; color: #555; line-height: 1.6; }
    .feature-tag { display: inline-block; margin-top: 16px; font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--green); letter-spacing: 2px; }
    
    footer { border-top: 1px solid #111; padding: 40px 60px; display: flex; justify-content: space-between; align-items: center; }
    .footer-brand { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: white; letter-spacing: 3px; }
    .footer-info { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: #333; letter-spacing: 2px; text-align: right; line-height: 1.8; }
  </style>
</head>
<body>

<section class="hero">
  <div class="hero-bg"></div>
  <div class="scan-line"></div>
  <div class="hero-content">
    <div class="hero-left">
      <div class="tag">// Pascal Robotics — France // 2026</div>
      <h1 class="hero-title">DOG<span>MORPH</span></h1>
      <p class="hero-sub">The world's first silent broadcast camera platform built on
